<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Reem Kufi Local';
    src: url('/fonts/reemkufi-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Tajawal Local';
    src: url('/fonts/tajawal-900.woff2') format('woff2');
    font-weight: 900;
    font-style: normal;
  }
  body { background: #070B14; color: white; padding: 25px; font-family: sans-serif; }
  .box { padding: 15px 25px; background: #162032; margin-bottom: 20px; border-radius: 10px; display: flex; align-items: center; gap: 20px; }
  .word { font-size: 32px; font-weight: 800; }
  .m { background: linear-gradient(135deg, #DC2626, #EA580C, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .x { background: linear-gradient(135deg, #2563EB, #4F46E5, #00E5BE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
  <div class="box">
    <div style="font-size: 16px; color: #38BDF8; width: 200px;">1. Reem Kufi Local:</div>
    <div class="word" style="font-family: 'Reem Kufi Local';">
      <span class="m">مثالي</span> <span class="x">إكس</span>
    </div>
  </div>

  <div class="box">
    <div style="font-size: 16px; color: #38BDF8; width: 200px;">2. Tajawal Local:</div>
    <div class="word" style="font-family: 'Tajawal Local';">
      <span class="m">مثالي</span> <span class="x">إكس</span>
    </div>
  </div>
</body>
</html>
