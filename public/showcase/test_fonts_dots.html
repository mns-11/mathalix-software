<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@800;900&family=Amiri:wght@700&family=Changa:wght@700;800&family=Alexandria:wght@800&family=Readex+Pro:wght@700&family=Noto+Kufi+Arabic:wght@700;800&display=swap" rel="stylesheet">
<style>
  body { background: #070B14; color: white; padding: 25px; font-family: sans-serif; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .item { background: #0F172A; padding: 15px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
  .name { font-size: 14px; color: #38BDF8; font-weight: bold; }
  .word { font-size: 28px; font-weight: 800; }
  .m { background: linear-gradient(135deg, #DC2626, #EA580C, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .x { background: linear-gradient(135deg, #2563EB, #4F46E5, #00E5BE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="name">1. Reem Kufi (كوفي انسيابي ناعم)</div>
      <div class="word" style="font-family: 'Reem Kufi', sans-serif;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>

    <div class="item">
      <div class="name">2. Tajawal (انسيابي حديث مع نقاط الياء)</div>
      <div class="word" style="font-family: 'Tajawal', sans-serif; font-weight: 900;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>

    <div class="item">
      <div class="name">3. Amiri (خط كلاسيكي متعرج مع نقاط)</div>
      <div class="word" style="font-family: 'Amiri', serif; font-weight: 700;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>

    <div class="item">
      <div class="name">4. Readex Pro (تقني ذو انحناءات)</div>
      <div class="word" style="font-family: 'Readex Pro', sans-serif; font-weight: 700;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>

    <div class="item">
      <div class="name">5. Noto Kufi Arabic (كوفي فخم مع نقاط الياء)</div>
      <div class="word" style="font-family: 'Noto Kufi Arabic', sans-serif; font-weight: 800;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>

    <div class="item">
      <div class="name">6. Changa (هندسي مائل ذو شخصية)</div>
      <div class="word" style="font-family: 'Changa', sans-serif; font-weight: 800;">
        <span class="m">مثالي</span> <span class="x">إكس</span>
      </div>
    </div>
  </div>
</body>
</html>
